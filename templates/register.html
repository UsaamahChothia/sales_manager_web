<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Enterprise Portal - Register Company</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        body {
            background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            padding: 20px 0;
        }
        .register-card {
            max-width: 480px;
            width: 100%;
            background: #ffffff;
            border-radius: 12px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.2);
            overflow: hidden;
        }
        .register-header {
            background: #ffffff;
            padding: 30px 20px 10px;
            text-align: center;
        }
    </style>
</head>
<body>
    <div class="register-card p-4">
        <div class="register-header mb-3">
            <div class="mb-2">
                <i class="fas fa-building fa-3x text-primary"></i>
            </div>
            <h4 class="fw-bold text-dark mb-1">New Business Registration</h4>
            <p class="text-muted small">Deploy an isolated terminal instance for your store</p>
        </div>

        {% with messages = get_flashed_messages(with_categories=true) %}
          {% if messages %}
            {% for category, message in messages %}
              <div class="alert alert-{{ category }} alert-dismissible fade show py-2 small" role="alert">
                {{ message }}
                <button type="button" class="btn-close py-2" data-bs-dismiss="alert"></button>
              </div>
            {% endfor %}
          {% endif %}
        {% endwith %}

        <form action="{{ url_for('register') }}" method="POST">
            <div class="mb-3">
                <label class="form-label small fw-bold">Company / Business Name</label>
                <div class="input-group">
                    <span class="input-group-text"><i class="fas fa-store"></i></span>
                    <input type="text" name="company_name" class="form-control" placeholder="e.g. Apex Retailers" required autofocus>
                </div>
            </div>

            <div class="mb-3">
                <label class="form-label small fw-bold">Admin Username</label>
                <div class="input-group">
                    <span class="input-group-text"><i class="fas fa-user-shield"></i></span>
                    <input type="text" name="username" class="form-control" placeholder="e.g. manager_apex" required>
                </div>
            </div>

            <div class="row g-2 mb-4">
                <div class="col-md-6">
                    <label class="form-label small fw-bold">Password</label>
                    <div class="input-group">
                        <span class="input-group-text"><i class="fas fa-lock"></i></span>
                        <input type="password" name="password" class="form-control" placeholder="••••••••" required>
                    </div>
                </div>
                <div class="col-md-6">
                    <label class="form-label small fw-bold">Confirm Password</label>
                    <div class="input-group">
                        <span class="input-group-text"><i class="fas fa-check-double"></i></span>
                        <input type="password" name="confirm_password" class="form-control" placeholder="••••••••" required>
                    </div>
                </div>
            </div>

            <button type="submit" class="btn btn-primary w-100 py-2 fw-bold shadow-sm">
                Create Store Instance <i class="fas fa-rocket ms-1"></i>
            </button>
        </form>

        <div class="mt-4 pt-3 border-top text-center small text-muted">
            Already have an account? <a href="{{ url_for('login') }}" class="fw-bold text-decoration-none text-primary">Sign in here</a>
        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
